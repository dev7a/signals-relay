<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">Signals Relay trace pipeline schematic</title>
  <desc id="desc">A cross-section schematic showing aws/spans flowing from CloudWatch through the partitioner, Kinesis trace lanes, the relay, and an OTLP backend.</desc>
  <style>
    .panel { fill: none; stroke: rgba(243, 236, 224, 0.22); stroke-width: 1; }
    .grid { fill: url(#grid); }
    .strip { fill: none; stroke: rgba(243, 236, 224, 0.12); stroke-width: 1; }
    .tag, .corner, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tag { fill: #c8a44a; font-size: 11px; letter-spacing: 0.08em; opacity: 0.85; }
    .tag-strong { font-weight: 700; opacity: 1; }
    .corner { fill: rgba(243, 236, 224, 0.48); font-size: 11px; }
    .corner-strong { fill: #f3ece0; font-weight: 700; }
    .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .crosshair { fill: none; stroke: rgba(243, 236, 224, 0.22); stroke-width: 1; }
    .hum { animation: hum 3s ease-in-out infinite; }
    @keyframes hum {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hum { animation: none !important; }
      .flow { display: none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 H 0 V 22" fill="none" stroke="rgba(243, 236, 224, 0.04)" stroke-width="1" />
    </pattern>
    <pattern id="schematic-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line stroke="#f3ece0" stroke-opacity="0.22" stroke-width="1" x1="0" x2="0" y1="0" y2="6" />
    </pattern>
    <linearGradient id="schematic-stream" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f3ece0" stop-opacity="0" />
      <stop offset="50%" stop-color="#f3ece0" stop-opacity="1" />
      <stop offset="100%" stop-color="#f3ece0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="schematic-rust" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d97a3a" stop-opacity="0" />
      <stop offset="50%" stop-color="#d97a3a" stop-opacity="1" />
      <stop offset="100%" stop-color="#d97a3a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="759" height="599" />
  <rect class="grid" x="1" y="1" width="758" height="598" />
  <rect class="strip" x="1" y="1" width="758" height="52" />

  <text class="tag" x="24" y="31"><tspan class="tag-strong">FIG. 01</tspan> &#183; TRACE PIPELINE &#183; CROSS-SECTION VIEW</text>
  <text class="corner" text-anchor="end" x="736" y="31">SCALE <tspan class="corner-strong">1:1</tspan>   SHEET <tspan class="corner-strong">1 of 4</tspan></text>

  <path class="crosshair" d="M 20 70 H 34 M 20 70 V 84" />
  <path class="crosshair" d="M 740 70 H 726 M 740 70 V 84" />
  <path class="crosshair" d="M 20 580 H 34 M 20 580 V 566" />
  <path class="crosshair" d="M 740 580 H 726 M 740 580 V 566" />

  <g transform="translate(50 58)">
    <g stroke="#f3ece0" stroke-opacity="0.16" stroke-width="1">
      <line stroke-dasharray="2 3" x1="0" x2="660" y1="260" y2="260" />
      <line stroke-dasharray="2 3" x1="330" x2="330" y1="0" y2="520" />
    </g>

    <g class="mono" fill="#c8a44a" fill-opacity="0.65" font-size="9">
      <text x="12" y="74">A</text>
      <text x="12" y="266">B</text>
      <text x="12" y="510">C</text>
      <text text-anchor="end" x="324" y="14">01</text>
      <text text-anchor="end" x="652" y="14">02</text>
    </g>

    <g class="hum">
      <rect fill="#f3ece0" fill-opacity="0.03" height="92" stroke="#f3ece0" stroke-opacity="0.6" stroke-width="1.2" width="120" x="40" y="200" />
      <rect fill="url(#schematic-hatch)" height="84" opacity="0.55" width="112" x="44" y="204" />
      <text class="serif" fill="#f3ece0" font-size="14" text-anchor="middle" x="100" y="180">Source</text>
      <text class="mono" fill="#f3ece0" font-size="10" text-anchor="middle" x="100" y="252">aws/spans</text>
      <text class="mono" fill="#f3ece0" fill-opacity="0.55" font-size="8" text-anchor="middle" x="100" y="268">cloudwatch &#183; logs</text>
    </g>

    <g>
      <rect fill="#d97a3a" fill-opacity="0.06" height="60" stroke="#d97a3a" stroke-opacity="0.75" stroke-width="1.2" width="100" x="220" y="220" />
      <text class="serif" fill="#f3ece0" font-size="13" text-anchor="middle" x="270" y="248">Partitioner</text>
      <text class="mono" fill="#d97a3a" font-size="8" text-anchor="middle" x="270" y="266">&#955; &#183; traceId</text>
    </g>

    <g>
      <rect fill="#c8a44a" fill-opacity="0.05" height="180" stroke="#c8a44a" stroke-opacity="0.65" stroke-width="1.2" width="146" x="362" y="180" />
      <text class="serif" fill="#f3ece0" font-size="13" text-anchor="middle" x="435" y="172">Kinesis &#183; trace lanes</text>
      <text class="mono" fill="#c8a44a" font-size="8" text-anchor="middle" x="435" y="376">60s tumbling window</text>

      <g class="mono" fill="#f3ece0" fill-opacity="0.6" font-size="7">
        <line stroke="#f3ece0" stroke-opacity="0.2" x1="362" x2="508" y1="206" y2="206" />
        <text x="368" y="200">trace_id 7af2</text>
        <rect fill="#f3ece0" fill-opacity="0.8" height="6" width="14" x="372" y="210" />
        <rect fill="#f3ece0" fill-opacity="0.5" height="6" width="10" x="392" y="210" />
        <rect fill="#f3ece0" fill-opacity="0.85" height="6" width="22" x="408" y="210" />
        <rect fill="#f3ece0" fill-opacity="0.45" height="6" width="16" x="436" y="210" />
        <rect fill="#f3ece0" fill-opacity="0.65" height="6" width="34" x="458" y="210" />

        <line stroke="#f3ece0" stroke-opacity="0.2" x1="362" x2="508" y1="240" y2="240" />
        <text x="368" y="234">trace_id 9e3c</text>
        <rect fill="#d97a3a" fill-opacity="0.78" height="6" width="22" x="372" y="244" />
        <rect fill="#d97a3a" fill-opacity="0.55" height="6" width="14" x="400" y="244" />
        <rect fill="#d97a3a" fill-opacity="0.9" height="6" width="40" x="420" y="244" />
        <rect fill="#d97a3a" fill-opacity="0.6" height="6" width="20" x="466" y="244" />

        <line stroke="#f3ece0" stroke-opacity="0.2" x1="362" x2="508" y1="274" y2="274" />
        <text x="368" y="268">trace_id b80a</text>
        <rect fill="#c8a44a" fill-opacity="0.78" height="6" width="12" x="372" y="278" />
        <rect fill="#c8a44a" fill-opacity="0.92" height="6" width="18" x="390" y="278" />
        <rect fill="#c8a44a" fill-opacity="0.55" height="6" width="26" x="414" y="278" />
        <rect fill="#c8a44a" fill-opacity="0.72" height="6" width="20" x="446" y="278" />
        <rect fill="#c8a44a" fill-opacity="0.4" height="6" width="14" x="472" y="278" />

        <line stroke="#f3ece0" stroke-opacity="0.2" x1="362" x2="508" y1="308" y2="308" />
        <text x="368" y="302">trace_id 1ce5</text>
        <rect fill="#c8a44a" fill-opacity="0.78" height="6" width="30" x="372" y="312" />
        <rect fill="#c8a44a" fill-opacity="0.55" height="6" width="14" x="408" y="312" />
        <rect fill="#c8a44a" fill-opacity="0.85" height="6" width="22" x="428" y="312" />
        <rect fill="#c8a44a" fill-opacity="0.6" height="6" width="36" x="456" y="312" />

        <line stroke="#f3ece0" stroke-opacity="0.2" x1="362" x2="508" y1="342" y2="342" />
        <text x="368" y="336">trace_id 4d11</text>
        <rect fill="#f3ece0" fill-opacity="0.7" height="6" width="18" x="372" y="346" />
        <rect fill="#f3ece0" fill-opacity="0.5" height="6" width="26" x="396" y="346" />
        <rect fill="#f3ece0" fill-opacity="0.8" height="6" width="40" x="428" y="346" />
      </g>

      <line stroke="#c8a44a" stroke-dasharray="3 3" stroke-width="1.4" x1="498" x2="498" y1="180" y2="360" />
      <text class="mono" fill="#c8a44a" font-size="8" x="500" y="190">now</text>
    </g>

    <g>
      <rect fill="#d97a3a" fill-opacity="0.06" height="60" stroke="#d97a3a" stroke-opacity="0.75" stroke-width="1.2" width="86" x="540" y="220" />
      <text class="serif" fill="#f3ece0" font-size="13" text-anchor="middle" x="583" y="248">Relay</text>
      <text class="mono" fill="#d97a3a" font-size="8" text-anchor="middle" x="583" y="266">&#955; &#183; OTLP/HTTP</text>
    </g>

    <g class="hum">
      <rect fill="#c8a44a" fill-opacity="0.07" height="76" stroke="#c8a44a" stroke-opacity="0.8" stroke-width="1.2" width="86" x="540" y="64" />
      <rect fill="url(#schematic-hatch)" height="68" opacity="0.4" width="78" x="544" y="68" />
      <text class="serif" fill="#f3ece0" font-size="13" text-anchor="middle" x="583" y="46">Backend</text>
      <text class="mono" fill="#c8a44a" font-size="8" text-anchor="middle" x="583" y="158">OTLP/HTTP</text>
    </g>

    <g fill="none" stroke="#f3ece0" stroke-opacity="0.22" stroke-width="1.4">
      <path d="M 160 246 L 220 246" />
      <path d="M 320 246 L 362 246" />
      <path d="M 508 246 L 540 246" />
      <path d="M 583 220 L 583 140" />
    </g>

    <g class="flow" fill="none" stroke-linecap="round" stroke-width="2">
      <path d="M 160 246 L 220 246" stroke="url(#schematic-stream)" stroke-dasharray="14 60">
        <animate attributeName="stroke-dashoffset" dur="1.6s" from="74" repeatCount="indefinite" to="0" />
      </path>
      <path d="M 320 246 L 362 246" stroke="url(#schematic-stream)" stroke-dasharray="10 40">
        <animate attributeName="stroke-dashoffset" dur="1.4s" from="50" repeatCount="indefinite" to="0" />
      </path>
      <path d="M 508 246 L 540 246" stroke="url(#schematic-rust)" stroke-dasharray="8 30">
        <animate attributeName="stroke-dashoffset" dur="1.3s" from="38" repeatCount="indefinite" to="0" />
      </path>
      <path d="M 583 220 L 583 140" stroke="url(#schematic-rust)" stroke-dasharray="14 60">
        <animate attributeName="stroke-dashoffset" dur="2.2s" from="74" repeatCount="indefinite" to="0" />
      </path>
    </g>

    <g class="flow">
      <circle fill="#f3ece0" r="3">
        <animateMotion dur="3s" path="M 160 246 L 220 246 L 320 246 L 362 246" repeatCount="indefinite" />
      </circle>
      <circle fill="#f3ece0" opacity="0.7" r="3">
        <animateMotion begin="-1s" dur="3s" path="M 160 246 L 220 246 L 320 246 L 362 246" repeatCount="indefinite" />
      </circle>
      <circle fill="#d97a3a" r="3">
        <animateMotion dur="2.2s" path="M 508 246 L 540 246 L 583 246 L 583 140" repeatCount="indefinite" />
      </circle>
      <circle fill="#d97a3a" opacity="0.7" r="3">
        <animateMotion begin="-1s" dur="2.2s" path="M 508 246 L 540 246 L 583 246 L 583 140" repeatCount="indefinite" />
      </circle>
    </g>

    <g class="mono" fill="#f3ece0" fill-opacity="0.55" font-size="8" stroke="#f3ece0" stroke-opacity="0.3" stroke-width="1">
      <line x1="40" x2="160" y1="448" y2="448" />
      <line x1="40" x2="40" y1="444" y2="452" />
      <line x1="160" x2="160" y1="444" y2="452" />
      <text stroke="none" text-anchor="middle" x="100" y="464">log group</text>

      <line x1="362" x2="508" y1="448" y2="448" />
      <line x1="362" x2="362" y1="444" y2="452" />
      <line x1="508" x2="508" y1="444" y2="452" />
      <text stroke="none" text-anchor="middle" x="435" y="464">trace-keyed lanes</text>
    </g>
  </g>
</svg>
