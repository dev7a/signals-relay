name: signals-relay-core release

on:
  push:
    tags:
      - "signals-relay-core-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic version tag to validate and package, for example signals-relay-core-v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_ROOT: release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Parse release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^signals-relay-core-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Expected tag format signals-relay-core-v<semver>, got: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Verify crate version matches tag
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "signals-relay-core") | .version')
          if [[ "$crate_version" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "signals-relay-core Cargo.toml version $crate_version does not match tag ${{ steps.tag.outputs.version }}" >&2
            exit 1
          fi

      - name: Run library tests
        run: cargo test -p signals-relay-core --locked

      - name: Package crate
        shell: bash
        run: |
          set -euo pipefail

          cargo package -p signals-relay-core --locked

          version="${{ steps.tag.outputs.version }}"
          artifact_dir="$RELEASE_ROOT/$version"
          mkdir -p "$artifact_dir"

          crate_file="target/package/signals-relay-core-$version.crate"
          cp "$crate_file" "$artifact_dir/"

          cat > "$artifact_dir/manifest.json" <<EOF
          {
            "tag": "${{ steps.tag.outputs.tag }}",
            "version": "$version",
            "commit": "${{ github.sha }}",
            "crate": "$(basename "$crate_file")"
          }
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signals-relay-core-${{ steps.tag.outputs.version }}
          path: ${{ env.RELEASE_ROOT }}/${{ steps.tag.outputs.version }}
          if-no-files-found: error
          retention-days: 14
