name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      share_scope:
        description: Whether to keep the SAR app private, share it with the AWS Organization, or make it public
        required: true
        default: account
        type: choice
        options:
          - account
          - organization
          - public

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare_release:
    if: github.event_name == 'workflow_dispatch'
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve SAM template path
        id: sam_template
        shell: bash
        run: |
          set -euo pipefail

          for candidate in template.yaml template.yml; do
            if [[ -f "$candidate" ]]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::Could not find a SAM template file (expected template.yaml or template.yml)."
          exit 1

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve semantic version from the repository
        id: version
        shell: bash
        run: |
          set -euo pipefail

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          version_lines="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '
                .packages[]
                | select(.name == "signals-relay" or .name == "signals-relay-core")
                | "\(.name)=\(.version)"
              '
          )"

          version_count="$(printf '%s\n' "$version_lines" | cut -d= -f2 | sort -u | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$version_count" != "1" ]]; then
            echo "::error::Workspace package versions do not agree on a single release version."
            echo "$version_lines"
            exit 1
          fi

          version="$(printf '%s\n' "$version_lines" | head -n1 | cut -d= -f2)"
          if [[ ! "$version" =~ $semver_regex ]]; then
            echo "::error::Repository version must use semver, got '$version'."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify SAM version matches the repository version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          SAM_TEMPLATE: ${{ steps.sam_template.outputs.path }}
        run: |
          set -euo pipefail

          sam_version_raw="$(
            sed -nE 's/^[[:space:]]*SemanticVersion:[[:space:]]*(.+)$/\1/p' "$SAM_TEMPLATE" | head -n1
          )"
          sam_version="$(scripts/normalize-yaml-scalar.sh "$sam_version_raw")"

          if [[ -z "$sam_version" ]]; then
            echo "::error::SAM template $SAM_TEMPLATE is missing Metadata.AWS::ServerlessRepo::Application.SemanticVersion"
            exit 1
          fi

          if [[ "$sam_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::SAM template version $sam_version does not match repository version $EXPECTED_VERSION"
            exit 1
          fi

      - name: Fail if the release tag already exists
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

  publish_from_dispatch:
    if: github.event_name == 'workflow_dispatch'
    name: Publish release from checked-out commit
    needs: prepare_release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      checkout_ref: ${{ github.sha }}
      release_tag: ${{ needs.prepare_release.outputs.release_tag }}
      share_scope: ${{ inputs.share_scope }}
      cfn_artifact_bucket: ${{ vars.CFN_ARTIFACT_BUCKET }}
    secrets: inherit

  tag_after_dispatch_publish:
    if: github.event_name == 'workflow_dispatch'
    name: Create release tag after successful publish
    needs:
      - prepare_release
      - publish_from_dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Create and push the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  publish_from_tag:
    if: github.event_name == 'push'
    name: Publish release from pushed tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      checkout_ref: refs/tags/${{ github.ref_name }}
      release_tag: ${{ github.ref_name }}
      share_scope: account
      cfn_artifact_bucket: ${{ vars.CFN_ARTIFACT_BUCKET }}
    secrets: inherit

  create_github_release:
    if: >-
      ${{
        always()
        && (
          (
            github.event_name == 'workflow_dispatch'
            && needs.publish_from_dispatch.result == 'success'
            && needs.tag_after_dispatch_publish.result == 'success'
          )
          || (
            github.event_name == 'push'
            && needs.publish_from_tag.result == 'success'
          )
        )
      }}
    name: Create GitHub Release
    needs:
      - prepare_release
      - publish_from_dispatch
      - tag_after_dispatch_publish
      - publish_from_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          PUSH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              release_tag="$DISPATCH_RELEASE_TAG"
              ;;
            push)
              release_tag="$PUSH_RELEASE_TAG"
              ;;
            *)
              echo "::error::Unsupported event for GitHub Release creation: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ ! "$release_tag" =~ ^v.+ ]]; then
            echo "::error::Release tag must start with 'v', got '$release_tag'."
            exit 1
          fi

          release_version="${release_tag#v}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Download release artifact bundle
        uses: actions/download-artifact@v6
        with:
          name: signals-relay-${{ steps.release.outputs.version }}
          path: release/${{ steps.release.outputs.version }}

      - name: Render release notes and collect assets
        id: release_assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          artifact_dir="release/$VERSION"
          manifest="$artifact_dir/cloudformation/manifest.json"
          notes_file="$RUNNER_TEMP/github-release-notes.md"
          asset_dir="$RUNNER_TEMP/github-release-assets"

          if [[ ! -f "$manifest" ]]; then
            echo "::error::Missing CloudFormation manifest at $manifest"
            exit 1
          fi

          python3 scripts/render_github_release_notes.py \
            --manifest "$manifest" \
            --output "$notes_file"

          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"
          cp "$manifest" "$asset_dir/signals-relay-$VERSION-cloudformation-manifest.json"
          cp "$artifact_dir/cloudformation/launch-no-vpc.yaml" "$asset_dir/signals-relay-$VERSION-launch-no-vpc.yaml"
          cp "$artifact_dir/cloudformation/launch-vpc.yaml" "$asset_dir/signals-relay-$VERSION-launch-vpc.yaml"
          cp "$artifact_dir/core/signals-relay-core-$VERSION.crate" "$asset_dir/"

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release_assets.outputs.notes_file }}
          ASSET_DIR: ${{ steps.release_assets.outputs.asset_dir }}
        run: |
          set -euo pipefail

          release_flags=(
            --verify-tag
            --title "Signals Relay $RELEASE_TAG"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          upload_flags=()
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_flags[@]}"
            upload_flags+=(--clobber)
          else
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" "$ASSET_DIR"/* "${upload_flags[@]}"
