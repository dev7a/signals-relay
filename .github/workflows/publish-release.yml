name: publish-release

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or commit SHA to check out for the release build
        required: true
        type: string
      release_tag:
        description: Release version tag name to validate and publish, for example v0.1.0 or v0.1.0-beta.1
        required: true
        type: string
      share_scope:
        description: Whether to keep the published SAR app private to the account or share it privately across the AWS Organization
        required: false
        default: "account"
        type: string
      cfn_artifact_bucket:
        description: S3 bucket for versioned CloudFormation launch template artifacts
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  SAM_CLI_TELEMETRY: "0"
  RELEASE_ROOT: release
  AWS_SAM_CLI_VERSION: "1.157.1"
  CARGO_LAMBDA_VERSION: "1.9.1"
  CARGO_LAMBDA_AARCH64_UNKNOWN_LINUX_MUSL_SHA256: "71cd6592eb19560fb8d9eec3675ea82dd4c042aa997036d62a11a5010fa5f759"
  ZIG_VERSION: "0.14.1"
  ZIG_AARCH64_LINUX_SHA256: "f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b"

jobs:
  publish:
    name: Package the core crate and publish the SAM app
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Resolve SAM template path
        id: sam_template
        shell: bash
        run: |
          set -euo pipefail

          for candidate in template.yaml template.yml; do
            if [[ -f "$candidate" ]]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::Could not find a SAM template file (expected template.yaml or template.yml)."
          exit 1

      - name: Resolve semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          tag="${{ inputs.release_tag }}"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Release tags must start with 'v'."
            exit 1
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ $semver_regex ]]; then
            echo "::error::Release tags must use vX.Y.Z or an allowed prerelease form such as vX.Y.Z-beta.1."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate sharing scope
        shell: bash
        env:
          SHARE_SCOPE: ${{ inputs.share_scope }}
        run: |
          set -euo pipefail

          case "$SHARE_SCOPE" in
            account|organization) ;;
            *)
              echo "::error::share_scope must be either 'account' or 'organization'."
              exit 1
              ;;
          esac

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and cargo tools
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-arm64
          key: cargo-lambda-${{ env.CARGO_LAMBDA_VERSION }}
          cache-on-failure: true

      - name: Verify workspace and SAM versions match tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          SAM_TEMPLATE: ${{ steps.sam_template.outputs.path }}
        run: |
          set -euo pipefail

          mismatches=$(
            cargo metadata --no-deps --format-version 1 |
              jq -r --arg expected "$EXPECTED_VERSION" '
                .packages[]
                | select(.name == "signals-relay" or .name == "signals-relay-core")
                | select(.version != $expected)
                | "\(.name)=\(.version)"
              '
          )

          if [[ -n "$mismatches" ]]; then
            echo "::error::Workspace package versions do not match tag $EXPECTED_VERSION"
            echo "$mismatches"
            exit 1
          fi

          sam_version_raw="$(
            sed -nE 's/^[[:space:]]*SemanticVersion:[[:space:]]*(.+)$/\1/p' "$SAM_TEMPLATE" | head -n1
          )"
          sam_version="$(scripts/normalize-yaml-scalar.sh "$sam_version_raw")"

          if [[ -z "$sam_version" ]]; then
            echo "::error::SAM template $SAM_TEMPLATE is missing Metadata.AWS::ServerlessRepo::Application.SemanticVersion"
            exit 1
          fi

          if [[ "$sam_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::SAM template version $sam_version does not match tag $EXPECTED_VERSION"
            exit 1
          fi

      - name: Run Rust tests
        run: |
          cargo test -p signals-relay-core --locked
          cargo test -p signals-relay --locked

      - name: Package the core crate artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cargo package -p signals-relay-core --locked

          artifact_dir="$RELEASE_ROOT/$VERSION/core"
          mkdir -p "$artifact_dir"

          crate_file="target/package/signals-relay-core-$VERSION.crate"
          cp "$crate_file" "$artifact_dir/"

          cat > "$artifact_dir/manifest.json" <<EOF
          {
            "tag": "${{ steps.version.outputs.tag }}",
            "version": "$VERSION",
            "commit": "$(git rev-parse HEAD)",
            "crate": "$(basename "$crate_file")"
          }
          EOF

      - name: Install cargo-lambda
        shell: bash
        run: |
          set -euo pipefail

          if command -v cargo-lambda >/dev/null 2>&1; then
            if installed_version="$(cargo lambda --version 2>/dev/null | awk '{print $2}')"; then
              if [[ "$installed_version" == "$CARGO_LAMBDA_VERSION" ]]; then
                echo "cargo-lambda $CARGO_LAMBDA_VERSION already available"
                exit 0
              fi
            else
              echo "Existing cargo-lambda is unusable; reinstalling"
            fi
          fi

          archive="cargo-lambda-v${CARGO_LAMBDA_VERSION}.aarch64-unknown-linux-musl.tar.gz"
          base_url="https://github.com/cargo-lambda/cargo-lambda/releases/download/v${CARGO_LAMBDA_VERSION}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$base_url/$archive" -o "$tmp_dir/$archive"
          echo "$CARGO_LAMBDA_AARCH64_UNKNOWN_LINUX_MUSL_SHA256  $tmp_dir/$archive" | sha256sum -c -

          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$tmp_dir/$archive" -C "$HOME/.cargo/bin"
          installed_version="$(cargo lambda --version | awk '{print $2}')"
          if [[ "$installed_version" != "$CARGO_LAMBDA_VERSION" ]]; then
            echo "Expected cargo-lambda $CARGO_LAMBDA_VERSION but found $installed_version" >&2
            exit 1
          fi

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$HOME/.local/zig/$ZIG_VERSION"
          if [[ -x "$install_dir/zig" ]]; then
            if installed_version="$(PATH="$install_dir:$PATH" zig version 2>/dev/null)"; then
              if [[ "$installed_version" == "$ZIG_VERSION" ]]; then
                echo "$install_dir" >> "$GITHUB_PATH"
                echo "zig $ZIG_VERSION already available"
                exit 0
              fi
            fi
          fi

          archive="zig-aarch64-linux-${ZIG_VERSION}.tar.xz"
          base_url="https://ziglang.org/download/${ZIG_VERSION}"
          extract_dir="zig-aarch64-linux-${ZIG_VERSION}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$base_url/$archive" -o "$tmp_dir/$archive"
          echo "$ZIG_AARCH64_LINUX_SHA256  $tmp_dir/$archive" | sha256sum -c -

          tar -xJf "$tmp_dir/$archive" -C "$tmp_dir"
          mkdir -p "$(dirname "$install_dir")"
          rm -rf "$install_dir"
          mv "$tmp_dir/$extract_dir" "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

          installed_version="$(PATH="$install_dir:$PATH" zig version)"
          if [[ "$installed_version" != "$ZIG_VERSION" ]]; then
            echo "Expected zig $ZIG_VERSION but found $installed_version" >&2
            exit 1
          fi

      - name: Install AWS SAM CLI
        run: python3 -m pip install "aws-sam-cli==$AWS_SAM_CLI_VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Build the SAM application
        run: sam build --template-file "${{ steps.sam_template.outputs.path }}" --beta-features

      - name: Package the SAM application
        shell: bash
        env:
          PACKAGE_BUCKET: ${{ secrets.SAR_ARTIFACT_BUCKET }}
          SAM_TEMPLATE: ${{ steps.sam_template.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${PACKAGE_BUCKET:-}" ]]; then
            echo "::error::SAR_ARTIFACT_BUCKET secret is required."
            exit 1
          fi

          artifact_dir="$RELEASE_ROOT/$VERSION/app"
          mkdir -p "$artifact_dir"
          packaged_template="$artifact_dir/packaged.yaml"
          built_template=".aws-sam/build/template.yaml"

          sam package \
            --template-file "$built_template" \
            --s3-bucket "$PACKAGE_BUCKET" \
            --s3-prefix "signals-relay/releases/$VERSION/app" \
            --output-template-file "$packaged_template"

          packaged_semantic_version_raw="$(
            sed -nE 's/^[[:space:]]*SemanticVersion:[[:space:]]*(.+)$/\1/p' "$packaged_template" | head -n1
          )"
          packaged_license_url_raw="$(
            sed -nE 's/^[[:space:]]*LicenseUrl:[[:space:]]*(.+)$/\1/p' "$packaged_template" | head -n1
          )"
          packaged_readme_url_raw="$(
            sed -nE 's/^[[:space:]]*ReadmeUrl:[[:space:]]*(.+)$/\1/p' "$packaged_template" | head -n1
          )"
          packaged_semantic_version="$(scripts/normalize-yaml-scalar.sh "$packaged_semantic_version_raw")"
          packaged_license_url="$(scripts/normalize-yaml-scalar.sh "$packaged_license_url_raw")"
          packaged_readme_url="$(scripts/normalize-yaml-scalar.sh "$packaged_readme_url_raw")"

          if [[ -z "$packaged_semantic_version" ]]; then
            echo "::error::Packaged template '$packaged_template' is missing Metadata.AWS::ServerlessRepo::Application.SemanticVersion"
            exit 1
          fi

          if [[ -z "$packaged_license_url" ]]; then
            echo "::error::Packaged template '$packaged_template' is missing Metadata.AWS::ServerlessRepo::Application.LicenseUrl"
            exit 1
          fi

          if [[ -z "$packaged_readme_url" ]]; then
            echo "::error::Packaged template '$packaged_template' is missing Metadata.AWS::ServerlessRepo::Application.ReadmeUrl"
            exit 1
          fi

          if [[ "$packaged_semantic_version" != "$VERSION" ]]; then
            echo "::error::Packaged template SemanticVersion '$packaged_semantic_version' does not match tag version $VERSION"
            exit 1
          fi

          if [[ ! "$packaged_license_url" =~ ^s3:// ]]; then
            echo "::error::Packaged template LicenseUrl must be an s3:// URL, got '$packaged_license_url'"
            exit 1
          fi

          if [[ ! "$packaged_readme_url" =~ ^s3:// ]]; then
            echo "::error::Packaged template ReadmeUrl must be an s3:// URL, got '$packaged_readme_url'"
            exit 1
          fi

          cat > "$artifact_dir/manifest.json" <<EOF
          {
            "tag": "${{ steps.version.outputs.tag }}",
            "version": "$VERSION",
            "commit": "$(git rev-parse HEAD)",
            "packagedTemplate": "packaged.yaml",
            "repository": "https://github.com/dev7a/signals-relay"
          }
          EOF

      - name: Package the CloudFormation launch templates
        shell: bash
        env:
          CFN_ARTIFACT_BUCKET: ${{ inputs.cfn_artifact_bucket }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${CFN_ARTIFACT_BUCKET:-}" ]]; then
            echo "::error::CFN_ARTIFACT_BUCKET variable is required."
            exit 1
          fi

          artifact_dir="$RELEASE_ROOT/$VERSION/cloudformation"
          mkdir -p "$artifact_dir"
          packaged_template="$artifact_dir/packaged.yaml"
          built_template=".aws-sam/build/template.yaml"
          cfn_prefix="signals-relay/cloudformation/releases/$VERSION"
          cfn_artifact_prefix="$cfn_prefix/artifacts"
          application_s3_uri="s3://$CFN_ARTIFACT_BUCKET/$cfn_prefix/packaged.yaml"
          application_template_url="https://s3.${AWS_REGION}.amazonaws.com/${CFN_ARTIFACT_BUCKET}/${cfn_prefix}/packaged.yaml"

          sam package \
            --template-file "$built_template" \
            --s3-bucket "$CFN_ARTIFACT_BUCKET" \
            --s3-prefix "$cfn_artifact_prefix" \
            --output-template-file "$packaged_template"

          aws s3 cp "$packaged_template" "$application_s3_uri"

          commit="$(git rev-parse HEAD)"
          summary_file="$artifact_dir/summary.md"
          python3 scripts/render_cfn_launch_templates.py \
            --source-dir cloudformation \
            --output-dir "$artifact_dir" \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --commit "$commit" \
            --bucket "$CFN_ARTIFACT_BUCKET" \
            --prefix "$cfn_prefix" \
            --region "$AWS_REGION" \
            --application-template-url "$application_template_url" \
            --summary-file "$summary_file"

          for launch_template in launch-no-vpc.yaml launch-vpc.yaml; do
            aws s3 cp "$artifact_dir/$launch_template" "s3://$CFN_ARTIFACT_BUCKET/$cfn_prefix/$launch_template"
          done

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signals-relay-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_ROOT }}/${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Serverless Application Repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          sam publish \
            --template "$RELEASE_ROOT/$VERSION/app/packaged.yaml" \
            --region "$AWS_REGION" \
            --semantic-version "$VERSION"

      - name: Share the published application with the AWS Organization
        if: ${{ inputs.share_scope == 'organization' }}
        shell: bash
        env:
          SAM_TEMPLATE: ${{ steps.sam_template.outputs.path }}
        run: |
          set -euo pipefail

          app_name_raw="$(
            sed -nE '/AWS::ServerlessRepo::Application:/,/^[^[:space:]]/ s/^[[:space:]]*Name:[[:space:]]*(.+)$/\1/p' "$SAM_TEMPLATE" | head -n1
          )"
          app_name="$(scripts/normalize-yaml-scalar.sh "$app_name_raw")"
          if [[ -z "$app_name" ]]; then
            echo "::error::SAM template $SAM_TEMPLATE is missing Metadata.AWS::ServerlessRepo::Application.Name"
            exit 1
          fi

          cleanup() {
            local path

            for path in "${policy_stdout:-}" "${policy_stderr:-}" "${verify_stderr:-}" "${org_stdout:-}" "${org_stderr:-}"; do
              if [[ -n "$path" ]]; then
                rm -f "$path"
              fi
            done
          }

          policy_stdout=""
          policy_stderr=""
          verify_stderr=""
          org_stdout="$(mktemp)"
          org_stderr="$(mktemp)"
          trap cleanup EXIT

          if aws organizations describe-organization \
            --query 'Organization.Id' \
            --output text >"$org_stdout" 2>"$org_stderr"; then
            normalized_org_id="$(cat "$org_stdout")"
          else
            org_error="$(cat "$org_stderr")"
            if [[ "$org_error" == *AccessDenied* || "$org_error" == *UnauthorizedOperation* || "$org_error" == *"not authorized"* ]]; then
              echo "::error::Failed to discover the AWS Organization ID for org-wide SAR sharing because the assumed release role is missing the required IAM permission organizations:DescribeOrganization."
              echo "::error::Ensure the publisher/release role policy allows organizations:DescribeOrganization before using share_scope=organization."
            else
              echo "::error::Failed to discover the AWS Organization ID for org-wide SAR sharing."
            fi
            printf '%s\n' "$org_error" >&2
            exit 1
          fi

          if [[ ! "$normalized_org_id" =~ ^o-[a-z0-9]{10,32}$ ]]; then
            echo "::error::Discovered AWS Organization ID is invalid: '$normalized_org_id'."
            exit 1
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          application_arn="arn:aws:serverlessrepo:${AWS_REGION}:${account_id}:applications/${app_name}"

          policy_stdout="$(mktemp)"
          policy_stderr="$(mktemp)"
          verify_stderr="$(mktemp)"

          if aws serverlessrepo get-application-policy \
            --region "$AWS_REGION" \
            --application-id "$application_arn" \
            --output json >"$policy_stdout" 2>"$policy_stderr"; then
            existing_policy_json="$(cat "$policy_stdout")"
          else
            policy_error="$(cat "$policy_stderr")"
            if grep -Eq 'ApplicationPolicy.*NotFound|ResourceNotFound|NotFoundException' <<<"$policy_error"; then
              existing_policy_json='{"Statements":[]}'
            else
              echo "::error::Failed to get existing application policy for $application_arn"
              cat "$policy_stderr" >&2
              exit 1
            fi
          fi

          merged_statements="$(
            jq -cn \
              --arg org_id "$normalized_org_id" \
              --argjson existing "$existing_policy_json" '
                (($existing.Statements // [])
                  | map(select(.StatementId != "share-org")))
                + [
                  {
                    StatementId: "share-org",
                    Actions: ["Deploy", "UnshareApplication"],
                    PrincipalOrgIDs: [$org_id],
                    Principals: ["*"]
                  }
                ]
              '
          )"

          applied="false"
          for attempt in 1 2 3 4 5; do
            if aws serverlessrepo put-application-policy \
              --region "$AWS_REGION" \
              --application-id "$application_arn" \
              --statements "$merged_statements" \
              >/dev/null; then
              applied="true"
              break
            fi

            sleep 5
          done

          if [[ "$applied" != "true" ]]; then
            echo "::error::Failed to apply the org-wide SAR sharing policy after publish."
            exit 1
          fi

          verified="false"
          last_verify_error=""
          for attempt in 1 2 3 4 5; do
            if policy_json="$(aws serverlessrepo get-application-policy \
                --region "$AWS_REGION" \
                --application-id "$application_arn" \
                --output json 2>"$verify_stderr")"; then
              if jq -e --arg org_id "$normalized_org_id" '
                any(.Statements[]?;
                  .StatementId == "share-org"
                  and ((.Actions // []) | index("Deploy"))
                  and ((.Actions // []) | index("UnshareApplication"))
                  and ((.Principals // []) | index("*"))
                  and ((.PrincipalOrgIDs // []) | index($org_id))
                )
              ' <<<"$policy_json" >/dev/null; then
                verified="true"
                break
              fi
            else
              last_verify_error="$(cat "$verify_stderr")"
            fi

            sleep 5
          done

          if [[ "$verified" != "true" ]]; then
            echo "::error::Failed to verify the org-wide SAR sharing policy after publish."
            if [[ -n "$last_verify_error" ]]; then
              printf '%s\n' "$last_verify_error" >&2
            fi
            exit 1
          fi
