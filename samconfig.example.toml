version = 0.1

# This file doubles as the local `samconfig.toml` template for
# `scripts/init_samconfig.py`. Keep the variable placeholders intact for values
# that are intended to be filled from local environment variables.

[default.build.parameters]
cached = true
parallel = false

[default.validate.parameters]

[default.deploy.parameters]
# Both export modes expect the shared OTLP secret
# `signals-relay/secrets/collector` to exist in this account and region.
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
region = "us-east-1"
resolve_s3 = true
parameter_overrides = [
  "ExportMode=direct",
  "DeploymentId=${DEPLOYMENT_ID}",
]

[collector.deploy.parameters]
# Both export modes expect the shared OTLP secret
# `signals-relay/secrets/collector` to exist in this account and region.
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
region = "us-east-1"
resolve_s3 = true
parameter_overrides = [
  "ExportMode=collector",
  "DeploymentId=${DEPLOYMENT_ID}",
  "CollectorExtensionArn=${COLLECTOR_EXTENSION_ARN}",
]

[default.global.parameters]
beta_features = true
profile = "${MONITORING_PROFILE}"
stack_name = "signals-relay"
tags = "application=signals-relay"

[collector.global.parameters]
profile = "${MONITORING_PROFILE}"
stack_name = "signals-relay"

[public_publish.build.parameters]
cached = true
parallel = false

[public_publish.package.parameters]
template_file = ".aws-sam/build/template.yaml"
s3_bucket = "${PUBLIC_SAR_BUCKET}"
s3_prefix = "signals-relay/manual"
output_template_file = ".aws-sam/publish-public.yaml"

[public_publish.publish.parameters]
template = ".aws-sam/publish-public.yaml"

[public_publish.global.parameters]
beta_features = true
profile = "${PUBLIC_PROFILE}"
region = "us-east-1"
