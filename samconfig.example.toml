version = 0.1

[default.build.parameters]
cached = true
parallel = false

[default.validate.parameters]

[default.deploy.parameters]
# Both export modes expect the shared OTLP secret
# `signals-relay/secrets/collector` to exist in this account and region.
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
region = "us-east-1"
resolve_s3 = true
parameter_overrides = [
  "ExportMode=direct",
  "DeploymentId=replace-me",
]

[collector.deploy.parameters]
# Both export modes expect the shared OTLP secret
# `signals-relay/secrets/collector` to exist in this account and region.
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
region = "us-east-1"
resolve_s3 = true
parameter_overrides = [
  "ExportMode=collector",
  "DeploymentId=replace-me",
  "CollectorExtensionArn=arn:aws:lambda:us-east-1:184161586896:layer:opentelemetry-collector-arm64-0_21_0:1",
]

[default.global.parameters]
beta_features = true
stack_name = "signals-relay"
tags = "application=signals-relay"

[collector.global.parameters]
stack_name = "signals-relay"

[public_publish.build.parameters]
cached = true
parallel = false

[public_publish.package.parameters]
template_file = ".aws-sam/build/template.yaml"
s3_bucket = "replace-with-public-sar-artifacts-bucket"
s3_prefix = "signals-relay/manual"
output_template_file = ".aws-sam/publish-public.yaml"

[public_publish.publish.parameters]
template = ".aws-sam/publish-public.yaml"

[public_publish.global.parameters]
beta_features = true
region = "us-east-1"
